server:
  port: ${PORT:8080}

spring:
  application:
    name: dragonball
  datasource:
    url: jdbc:postgresql://${DB_HOST:your-oracle-ip}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:your-coolify-db-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
minio:
  endpoint: ${MINIO_ENDPOINT:http://your-oracle-ip:9000}
  access-key: ${MINIO_ACCESS_KEY:admin_user}
  secret-key: ${MINIO_SECRET_KEY:ChooseAStrongPassword123!}
  bucket: dragonball-assets

app:
  base-url: ${APP_BASE_URL:http://localhost:${server.port}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs