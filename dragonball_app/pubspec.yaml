name: dragonball_app
description: A Dragon Ball Explorer demonstrating Riverpod and Flutter Hooks.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+7

environment:
  sdk: ">=3.4.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  meta: ^1.18.0
  http: ^1.6.0
  path_provider: ^2.1.6
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  cached_network_image: ^4.0.2
  flutter_dotenv: ^6.0.1
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  flutter_cache_manager: ^3.4.5
  package_info_plus: ^10.2.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  cross_file: ^0.3.5+5
  phosphoricons_flutter: ^1.1.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/dragonball-8.png"
  remove_alpha_ios: true

  adaptive_icon_background: "#FFFAF5"
  adaptive_icon_foreground: "assets/dragonball-8.png"

  web:
    generate: true
    image_path: "assets/dragonball-8.png"
    background_color: "#FFFAF5"
    theme_color: "#ED6C24"

flutter_native_splash:
  color: "#FFFAF5"
  color_dark: "#171717"

  image: "assets/dragonball-8.png"
  image_dark: "assets/dragonball-8.png"

  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFAF5"
    color_dark: "#171717"

    image: "assets/dragonball-8.png"
    image_dark: "assets/dragonball-8.png"

    icon_background_color: "#FFFAF5"
    icon_background_color_dark: "#171717"
    

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/dragonball-8.png
    - .env
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg